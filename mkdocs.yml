site_name: iheap
site_description: Fast indexed priority queue (pqdict-style) for Python with a Rust core
site_url: https://nvbkdw.github.io/iheap/
repo_url: https://github.com/nvbkdw/iheap
repo_name: nvbkdw/iheap
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Ryan Huang — MIT License

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - API reference: api.md
  - Benchmark: benchmark.md
  - Development: development.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            docstring_section_style: table
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

watch:
  - python/iheap
