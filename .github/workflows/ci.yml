name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MATURIN_VERSION: "v1.15.0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# Actions are pinned to commit SHAs (comment: the tag they correspond to).
jobs:
  # ---------------------------------------------------------------- Rust core
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -p iheap-core
      - name: Minimum supported Rust version (1.88)
        run: |
          rustup toolchain install 1.88 --profile minimal
          cargo +1.88 check -p iheap-core

  # Run the core's tests on 32-bit and big-endian targets under emulation.
  rust-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu         # 32-bit
          - armv7-unknown-linux-gnueabihf  # 32-bit ARM
          - s390x-unknown-linux-gnu        # big-endian
          - powerpc64le-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with: { tool: cross }
      - run: cross test -p iheap-core --release --target ${{ matrix.target }}

  # ---------------------------------------------- Python, built from source
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "3.15t"]
        include:
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.15" }
          - { os: macos-latest, python: "3.15t" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.15" }
          - { os: windows-latest, python: "3.15t" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and test both cores
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          python -m pip install -U pip
          pip install --group dev
          maturin develop --release
          pytest -q
          IHEAP_BACKEND=python pytest -q   # the pure-Python core

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Build (strict)
        run: |
          python -m pip install -U pip
          pip install --group docs
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # ------------------------------------------------------------------ wheels
  # cp311-abi3: one wheel per platform for every GIL-enabled CPython >= 3.11,
  # with the lock-free (GIL-protected) core.
  wheels:
    needs: [rust, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: i686, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: armv7, manylinux: auto }
          - { os: ubuntu-latest, target: ppc64le, manylinux: auto }
          - { os: ubuntu-latest, target: s390x, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: i686, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: armv7, manylinux: musllinux_1_2 }
          - { os: windows-latest, target: x64, arch: x64 }
          - { os: windows-latest, target: x86, arch: x86 }
          - { os: windows-11-arm, target: aarch64, arch: arm64 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: macos-14, target: aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-abi3-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist

  # Free-threaded CPython cannot load abi3 wheels. 3.14t gets cp314t wheels;
  # 3.15t and later share one cp315-abi3t wheel (PEP 803), retagged abi3t-only
  # so GIL-enabled 3.15 keeps using the lock-free cp311-abi3 wheel. Both carry
  # the mutex core. Built natively, on runners that have both interpreters.
  wheels-freethreaded:
    needs: [rust, test]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14t", "3.15t"]
        platform:
          # manylinux_2_28: the end-of-life manylinux2014 image lacks newer
          # free-threaded interpreters.
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: macos-14, target: aarch64 }
          - { os: windows-latest, target: x64 }
          - { os: windows-11-arm, target: aarch64 }
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - id: py
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Select interpreter and ABI
        shell: bash
        run: |
          # Linux builds run in a manylinux/musllinux container that ships the
          # free-threaded interpreters; elsewhere use setup-python's.
          if [ "$RUNNER_OS" = Linux ]; then
            interpreter="python${{ matrix.python }}"
          else
            interpreter='${{ steps.py.outputs.python-path }}'
          fi
          features=""
          if [ "${{ matrix.python }}" = "3.15t" ]; then
            features="--features pyo3/abi3t-py315"
          fi
          echo "BUILD_ARGS=--release --out dist -i $interpreter $features" >> "$GITHUB_ENV"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: ${{ env.BUILD_ARGS }}
      - name: Retag abi3t wheels (abi3t only)
        if: matrix.python == '3.15t'
        shell: bash
        run: |
          python -m pip install "wheel>=0.45"
          for whl in dist/*abi3.abi3t*.whl; do
            python -m wheel tags --abi-tag abi3t --remove "$whl"
          done
          ls dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-ft${{ matrix.python }}-${{ matrix.platform.os }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux || 'native' }}
          path: dist

  # Pure-Python fallback for interpreters no native wheel fits (CPython 3.13t,
  # PyPy, other platforms): a platform wheel minus the extension.
  wheel-pure:
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheels-abi3-ubuntu-latest-x86_64-auto
          path: native
      - run: python scripts/make_pure_wheel.py native/*.whl dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-pure
          path: dist

  sdist:
    needs: [rust, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-sdist
          path: dist

  # ------------------------------------------- install and test what we ship
  test-sdist:
    needs: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheels-sdist
          path: dist
      - name: Build from source and run the bundled tests
        run: |
          pip install dist/*.tar.gz pytest pqdict
          mkdir src && tar xzf dist/*.tar.gz -C src --strip-components 1
          cd src && python -c "import iheap; assert iheap.NATIVE" && python -m pytest -q tests

  # Native runners: let pip choose among all built wheels, then test.
  test-wheels:
    needs: [wheels, wheels-freethreaded, wheel-pure]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.15" }
          - { os: ubuntu-latest, python: "3.14t" }
          - { os: ubuntu-latest, python: "3.15t" }
          - { os: ubuntu-24.04-arm, python: "3.13" }
          - { os: ubuntu-24.04-arm, python: "3.15t" }
          - { os: macos-14, python: "3.12" }
          - { os: macos-14, python: "3.14t" }
          - { os: macos-14, python: "3.15t" }
          - { os: macos-15-intel, python: "3.13" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.15t" }
          - { os: windows-latest, python: "3.13", arch: x86 }
          - { os: windows-11-arm, python: "3.13" }
          # No native wheel fits these: the pure-Python wheel must be chosen.
          - { os: ubuntu-latest, python: "3.13t", pure: true }
          - { os: macos-14, python: "3.13t", pure: true }
          - { os: windows-latest, python: "3.13t", pure: true }
          - { os: ubuntu-latest, python: "pypy3.11", pure: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Install the wheel pip picks, and test it
        shell: bash
        run: |
          rm -f dist/*.tar.gz
          python -m pip install pytest pqdict
          python -m pip install --no-index --find-links dist iheap
          python -c "import iheap, sys; print(sys.version, '->', 'native' if iheap.NATIVE else 'pure')"
          python -c "import iheap; assert iheap.NATIVE == ('${{ matrix.pure }}' != 'true')"
          python -m pytest -q tests

  # Other architectures: test the wheels under QEMU emulation.
  test-wheels-emulated:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/386, image: "python:3.13-slim" }
          - { platform: linux/arm/v7, image: "python:3.13-slim" }
          - { platform: linux/ppc64le, image: "python:3.13-slim" }
          - { platform: linux/s390x, image: "python:3.13-slim" }
          - { platform: linux/386, image: "python:3.13-alpine" }
          - { platform: linux/arm/v7, image: "python:3.13-alpine" }
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-abi3-*
          path: dist
          merge-multiple: true
      - name: Install and test under emulation
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/w" -w /w ${{ matrix.image }} sh -c '
            set -e
            pip install -q pytest pqdict
            pip install -q --no-index --find-links dist iheap
            python -c "import iheap, platform; print(platform.machine()); assert iheap.NATIVE"
            python -m pytest -q tests'

  # ----------------------------------------------------------------- publish
  publish:
    # PyPI Trusted Publishing: the "iheap" project trusts this repository,
    # workflow "ci.yml" and environment "pypi".
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, test-sdist, test-wheels, test-wheels-emulated]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # Only distributions: the run also holds the docs site artifact.
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Tag must match the package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls dist
          test -f "dist/iheap-${version}.tar.gz" || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match the built version"; exit 1; }
      - name: pypi-publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
