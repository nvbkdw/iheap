name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14", "3.14t"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Rust lint and tests
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test -p iheap-core
      - name: Python tests
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          python -m pip install -U pip  # maturin develop uses `pip install --group` (pip >= 25.1)
          pip install maturin pytest pqdict
          maturin develop --release
          pytest -q

  wheels:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-14, target: x86_64 }  # cross-compiled; Intel runners are retired
          - { os: macos-14, target: aarch64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build (strict)
        run: |
          python -m pip install -U pip
          pip install --group docs
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # abi3 wheels cannot load on free-threaded CPython, so it gets
  # version-specific cp314t wheels, built natively on each platform. (PyO3
  # supports free-threading from 3.14, where it is no longer experimental.)
  wheels-freethreaded:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: macos-14, target: aarch64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: py314t
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14t"
      - name: Select interpreters
        shell: bash
        run: |
          # Linux builds run in a manylinux/musllinux container that ships
          # the free-threaded interpreter; elsewhere use setup-python's.
          if [ "$RUNNER_OS" = Linux ]; then
            echo "INTERPRETERS=-i python3.14t" >> "$GITHUB_ENV"
          else
            echo "INTERPRETERS=-i ${{ steps.py314t.outputs.python-path }}" >> "$GITHUB_ENV"
          fi
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist ${{ env.INTERPRETERS }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-ft-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    # PyPI Trusted Publishing: configure the "iheap" project on pypi.org to
    # trust this repository, workflow "ci.yml" and environment "pypi".
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, wheels-freethreaded, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Only distributions: the run also holds the docs site artifact.
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: pypi-publish
        uses: pypa/gh-action-pypi-publish@v1.14.2
