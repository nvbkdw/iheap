[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "iheap"
description = "Fast indexed priority queue (pqdict-style) with a Rust core"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Huang", email = "ryan.huang@noetik.ai" }]
requires-python = ">=3.10"
keywords = ["priority queue", "heap", "indexed heap", "pqdict", "dijkstra"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/nvbkdw/iheap"
Issues = "https://github.com/nvbkdw/iheap/issues"
Documentation = "https://nvbkdw.github.io/iheap/"

[dependency-groups]
dev = ["maturin>=1.7,<2", "pytest>=8", "pqdict>=1.4"]
# mkdocs 2.0 drops the plugin system that mkdocs-material/mkdocstrings need.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "ruff"]

[tool.maturin]
manifest-path = "crates/iheap-py/Cargo.toml"
python-source = "python"
module-name = "iheap._iheap"
features = ["pyo3/extension-module"]
profile = "release"

[tool.pytest.ini_options]
testpaths = ["tests", "python/iheap"]
addopts = "--doctest-modules"
