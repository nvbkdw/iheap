[workspace]
resolver = "2"
members = ["crates/iheap-core", "crates/iheap-py"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nvbkdw/iheap"
rust-version = "1.88"  # std::hint::select_unpredictable

[profile.release]
lto = "fat"
codegen-units = 1
# Keep unwinding: PyO3 turns a panic into a Python exception; abort would
# take the whole interpreter down.
